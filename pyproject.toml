[project]
name = "dozenwazn"
version = "0.1.0"
description = "Generate and validate all possible Arabic verb forms from trilateral and quadrilateral roots"
requires-python = ">=3.11"
dependencies = [
    "tiktoken",
    "rich",
    "arabic-reshaper",
    "python-bidi",
    "pydantic",
    "click",
    "tokenizers>=0.20",
    "huggingface-hub[cli]>=1.9.0",
    "httpx>=0.27.0",
]

[project]
name = "dozenwazn"
version = "0.1.0"
description = "Generate and validate all possible Arabic verb forms from trilateral and quadrilateral roots"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "tiktoken",
    "rich",
    "arabic-reshaper",
    "python-bidi",
    "pydantic",
    "click",
    "tokenizers>=0.20",
    "huggingface-hub[cli]>=1.9.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "sentencepiece>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
